name: OFAC Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  sync-ofac:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OFAC_USE_LOCAL_XML: "false"
      OFAC_DOWNLOAD_METHOD: "curl"
      OFAC_FALLBACK_TO_LOCAL_XML: "false"
      OFAC_ALLOW_INSECURE_DOWNLOAD: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OFAC sync
        run: |
          python 制裁筛查模块/ofac_sync.py
