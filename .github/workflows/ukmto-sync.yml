name: UKMTO Reports Sync

on:
  workflow_dispatch:
  schedule:
    # Once an hour at minute 7 (UTC), offset from the top of the hour.
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: ukmto-reports-sync
  cancel-in-progress: false

jobs:
  sync-ukmto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: 情报收集模块

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 情报收集模块/requirements.txt

      - name: Install ingestion dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect and persist UKMTO reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Reuse either existing vessel-tracking or OFAC credentials if the
          # dedicated SUPABASE_SERVICE_KEY secret has not been configured.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHON_DOTENV_DISABLED: "1"
          UKMTO_REQUEST_TIMEOUT_SECONDS: "30"
          UKMTO_REQUEST_RETRIES: "3"
          UKMTO_REQUEST_INTERVAL_SECONDS: "1"
          UKMTO_USER_AGENT: "RiskMonitor/0.1 (scheduled UKMTO ingestion)"
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_KEY" ]]; then
            echo "::error::Configure SUPABASE_URL and a Supabase service/secret key in repository Actions secrets."
            exit 1
          fi

          # The RPC is idempotent. Retry one failed database run to recover
          # transient connection errors; keep configuration/source failures visible.
          status=0
          python scripts/fetch_ukmto_incidents.py --max-incidents 1000 || status=$?
          if [[ "$status" -eq 3 ]]; then
            echo "::warning::Database write failed; retrying the idempotent collection once in 30 seconds."
            sleep 30
            status=0
            python scripts/fetch_ukmto_incidents.py --max-incidents 1000 || status=$?
          fi
          exit "$status"
