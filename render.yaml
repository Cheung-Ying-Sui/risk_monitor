services:
  - type: web
    name: risk-monitor-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: API_AUTHORIZED_USER_IDS
        sync: false
      - key: API_PUBLIC_SIGNUP_ACCESS
        value: "true"
      - key: API_TEMP_USER_ACCESS_DAYS
        value: "7"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://risk-monitor-frontend-alpha.vercel.app,https://maritime-risk-platform.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: '^https://(?:risk-monitor-frontend(?:-alpha|-([a-z0-9]+-zys18476615082-7273))?|maritime-risk-platform(?:-([a-z0-9]+-zys18476615082-7273))?)\.vercel\.app$'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
